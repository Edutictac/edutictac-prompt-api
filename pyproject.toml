[project]
name = "edutictac-prompt-api"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.40.0",
  "httpx==0.28.1",
  "authlib>=1.3.0",
  "edutictac-community @ git+https://git.edutictac.es/Edutictac/edutictac-community.git@v0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
